name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate release version and notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          if (process.env.GITHUB_REF_NAME !== `v${version}` || lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('Release tag, manifest, and lockfile versions must match.');
          }
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).find(part => part.startsWith(`[${version}] - `));
          const notes = section?.split('\n').slice(1).join('\n').trim();
          if (!notes) { throw new Error('Release notes are missing from CHANGELOG.md.'); }
          fs.writeFileSync('release-notes.md', notes + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `VSIX_PATH=trailing-fun-${version}.vsix\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests and lint
        run: xvfb-run -a npm test

      - name: Package Extension
        run: npx vsce package --no-dependencies --out "$VSIX_PATH"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "$VSIX_PATH" --skip-duplicate
          else
            echo "::notice::VSCE_PAT is not configured. Upload the GitHub release VSIX to Marketplace manually."
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX_PATH" --verify-tag \
              --title "Trailing Fun $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
